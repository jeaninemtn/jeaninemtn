name: Metrics - Languages

on:
  workflow_dispatch:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: prod
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN }}
